name: Feature request
description: Suggest an improvement or new capability.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: Describe the problem first. Features that send data externally must keep the Jev approval gate.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [Meta Server shell, Inbox / social / ads, Business modules (invoices, inventory, CRM), Agents / models, MUSE voice, Docs, Other]
  - type: checkboxes
    id: help
    attributes:
      label: Contribution
      options:
        - label: I'd like to work on this
